name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Permanent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/jarvis.jks" ]; then
            echo "Generating permanent jarvis.jks keystore..."
            keytool -genkeypair -alias jarvis -keypass jarvis123 -keystore keystore/jarvis.jks -storepass jarvis123 -dname "CN=Jarvis, O=Jarvis, C=US" -validity 10000 -keyalg RSA -keysize 2048
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add keystore/jarvis.jks
            git commit -m "chore: persist jarvis.jks signing key [skip ci]" || true
            git push origin main || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Complete Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-assistant-release-apk
          path: app/build/outputs/apk/release/*.apk
